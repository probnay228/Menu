<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Вход в админ-панель — Кухни мира 2026</title>
    <link rel="stylesheet" href="assets/css/base.css">
    <link rel="stylesheet" href="assets/css/auth.css">
</head>
<body>
    <div class="auth-wrapper">
        <div class="auth-card">
            <div class="auth-header">
                <h1>Кухни мира</h1>
                <p>2026 — Год единства народов России</p>
            </div>

            <!-- Переход на recipes.html при нажатии "Войти" -->
            <form action="recipes.html" method="GET">
                <div class="form-group">
                    <label class="form-label" for="email">Электронная почта *</label>
                    <input type="text" id="email" name="email" class="form-control" value="admin@champ2026" required>
                    <span class="invalid-feedback">Введите корректный адрес электронной почты.</span>
                </div>

                <div class="form-group">
                    <label class="form-label" for="password">Пароль *</label>
                    <input type="password" id="password" name="password" class="form-control" value="champ2026" required>
                    <span class="invalid-feedback">Поле пароля обязательно для заполнения.</span>
                </div>

                <button type="submit" class="btn btn-primary auth-submit">Войти</button>
            </form>
        </div>
    </div>
</body>
</html>
